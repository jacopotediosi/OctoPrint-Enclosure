[build-system]
requires = [
    "setuptools>=68",
]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-Enclosure"
version = "4.13.2"
description = "Awesome plugin to control everything that you ever wanted on your enclosure"
authors = [
    { name = "Jacopo Tediosi", email = "jacopotediosi@gmail.com" },
    { name = "Vitor Henrique", email = "vitormhenrique@gmail.com" },
]
requires-python = ">=3.7,<4"
dependencies = [
    "Adafruit-Blinka",  # for microcontroller.Pin used by DHT sensors
    "adafruit-circuitpython-dht>=3.5.0",  # min is 3.5.0 for adafruit_dht.exit()
    "bme680>=1.1.0",  # versions before 1.1.0 are broken
    "gpiozero>=1.5.0,!=2.0",  # for gpiozero.CPUTemperature; versions before 1.5.0 and 2.0 are broken
    "requests>=2.4.0",  # min is 2.4.0 for the (connect, read) timeout tuple
    "RPi.bme280>=0.2.0",  # min is 0.2.0 for the compensation_params in sample() signature
    "RPi.GPIO>=0.5.11",  # min is 0.5.11 for GPIO.getmode()
    "rpi_ws281x>=3.1.0",  # min is 3.1.0 for the strip_type parameter of PixelStrip
    "smbus2>=0.3.0",  # min is 0.3.0 for SMBus as context manager
    "spidev>=3.2",  # min is 3.2 for SpiDev as context manager
    "typing_extensions>=4.4",  # min is 4.4 for typing_extensions.override
]
dynamic = [
    "license",
]

[project.entry-points."octoprint.plugin"]
enclosure = "octoprint_enclosure"

[project.urls]
Homepage = "https://github.com/jacopotediosi/OctoPrint-Enclosure"

[project.optional-dependencies]
develop = [
    "go-task-bin",
]

[dependency-groups]
typechecking = [
    "OctoPrint==2.0.0 ; python_version >= '3.9' and python_version < '3.16'",
    "types-RPi.GPIO ; python_version >= '3.9' and python_version < '3.16'",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "octoprint_enclosure",
    "octoprint_enclosure.*",
]

[tool.ruff]
line-length = 120
fix = true

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
extend-select = [
    "ALL",
    "D420", # incorrect-section-order (preview)
    "DOC102", # docstring-extraneous-parameter (preview)
    "DOC201", # docstring-missing-returns (preview)
    "DOC202", # docstring-extraneous-returns (preview)
    "DOC402", # docstring-missing-yields (preview)
    "DOC403", # docstring-extraneous-yields (preview)
    "DOC501", # docstring-missing-exception (preview)
]
ignore = [
    "C901", # complex-structure
    "CPY001", # missing-copyright-notice
    "D100", # undocumented-public-module
    "D104", # undocumented-public-package
    "PERF203", # try-except-in-loop
    "PLR0912", # too-many-branches
    "PLR0913", # too-many-arguments
    "PLR0915", # too-many-statements
    "PLR0917", # too-many-positional-arguments
    "PLR2004", # magic-value-comparison
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["octoprint_enclosure.settings.setting", "octoprint_enclosure.utils.Rgb"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["octoprint_enclosure.settings.BaseConfig"]

[tool.ruff.lint.per-file-ignores]
"dev_tools/*" = [
    "INP001", # implicit-namespace-package
]

[tool.ruff.lint.pydoclint]
ignore-one-line-docstrings = true

[tool.ty.environment]
python-version = "3.7"

[tool.djlint]
ignore = [
    "H021", # inline styles are tolerated
]
